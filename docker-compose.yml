name: learnharness

services:
  app:
    build:
      context: .
      args:
        # Chromium is optional; the default image is server-only.
        WITH_CHROMIUM: "${WITH_CHROMIUM:-0}"
    image: learnharness:latest
    container_name: learnharness
    restart: unless-stopped
    # Reap Chromium/child processes and forward SIGTERM cleanly.
    init: true
    ports:
      # Host port is configurable; the container always listens on 3000.
      - "${LH_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      LH_DATA_DIR: "/data"
      LH_AUTH_FILE: "/data/auth.json"
      # Exact public host names accepted by the browser API gate.
      LH_ALLOWED_HOSTS: "${LH_ALLOWED_HOSTS:-}"
      # Multiuser authentication is runtime-configured through .env
      # (env_file above). See .env.example. Leave it unset for the historical
      # single-user deployment. Milestone 1 exposes auth/account surfaces only:
      # every learning route returns 503 until worker isolation lands.
      #
      # LH_DEPLOYMENT_MODE: "multiuser-web"
      # LH_READ_ONLY_ROOT_FS: "1"
      # LH_WRITABLE_MOUNTS: "/data"
      # LH_ACCOUNT_ROOT: "/data/accounts"
      # LH_CONTROLLER_STATE_DIR: "/data/controller"
      # LH_STAGING_DIR: "/data/staging"
      # LH_SNAPSHOT_DIR: "/data/snapshots"
      # LH_PRIVATE_WORK_DIR: "/data/work"
      # LH_AUTH_PROVIDER: "clerk"
      # CLERK_ISSUER: "https://your-instance.clerk.accounts.dev"
      # LH_APP_ORIGIN: "https://learn.example.com"
      #
      # A real multiuser deployment additionally needs a read-only root and a
      # writable /tmp tmpfs; the root-helper mount model is Phase 3 work:
      # read_only: true
      # tmpfs:
      #   - /tmp:size=1g,mode=1777
    # Optional: copy .env.example to .env to pass provider keys from the
    # host environment. Keys added in Settings are stored in the volume.
    env_file:
      - path: .env
        required: false
    volumes:
      # All chats, graph ledgers, settings and auth.json live here.
      - learnharness-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  learnharness-data:
